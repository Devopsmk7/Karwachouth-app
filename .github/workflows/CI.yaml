
name: Karwa Chauth Docker CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build HTML and Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check project files
        run: ls -la

      - name: Validate HTML file
        run: |
          if [ -f index.html ]; then
            echo "HTML file found!"
          else
            echo "HTML file missing!"
            exit 1
          fi

      - name: Check Docker version
        run: docker --version

      - name: Build Docker image
        run: docker build -t karwa-chauth-app:v1 .

      - name: Verify Docker image
        run: docker images

      - name: CI Pipeline Success
        run: echo "HTML and Docker build completed successfully!"
